services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://carnet:${POSTGRES_PASSWORD}@db:5432/carnet
      SIGNUP_CODE: ${SIGNUP_CODE}
      DATA_DIR: /data
      PORT: "3541"
    volumes:
      - photos:/data
    depends_on:
      - db
    expose:
      - "3541"
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: carnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: carnet
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  photos:
  pgdata:

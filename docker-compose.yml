services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_APP_3541
      - PORT=3541
      - DATA_DIR=/data
      - DATABASE_URL=postgres://carnet:${POSTGRES_PASSWORD:-VJEcDNyeXnDKXSISoi8ZGzgmR6CGrbWH}@db:5432/carnet
      - SIGNUP_CODE=${SIGNUP_CODE:-M4SA-WJJZ}
    volumes:
      - photos:/data
    depends_on:
      - db
    expose:
      - "3541"
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=carnet
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-VJEcDNyeXnDKXSISoi8ZGzgmR6CGrbWH}
      - POSTGRES_DB=carnet
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  photos:
  pgdata:

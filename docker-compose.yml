services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - PORT=3541
      - DATA_DIR=/data
      - DATABASE_URL=postgres://carnet:${SERVICE_PASSWORD_POSTGRES}@db:5432/carnet
      - SIGNUP_CODE=${SERVICE_PASSWORD_SIGNUP}
    volumes:
      - photos:/data
    depends_on:
      - db
   ports:
      - "3541:3541"
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=carnet
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=carnet
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  photos:
  pgdata:
